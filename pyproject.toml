[project]
name = "haqiqat"
version = "0.1.0"
description = "Open-source news aggregation and verification: merge coverage from every side, separate confirmed facts from claims, publish to web and Telegram."
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE", "LICENSE-DATA"]
requires-python = ">=3.11"
dependencies = [
    "feedparser>=6.0",
    "httpx>=0.27",
    "jinja2>=3.1",
    "numpy>=1.26",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "trafilatura>=1.12",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
# Native Claude backend (prompt caching, server-side fallbacks). Not needed for
# OpenAI-compatible providers.
anthropic = ["anthropic>=1.0"]
# Run embeddings locally instead of through an API (needs ~2-3 GB RAM for bge-m3).
local = ["sentence-transformers>=3.0"]

[project.scripts]
haqiqat = "haqiqat.cli:main"

[dependency-groups]
dev = [
    "anthropic>=1.0",
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/haqiqat"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # Persian text legitimately contains "ambiguous" characters

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
