# Top level of IPTC Media Topics (https://iptc.org/standards/media-topics/, CC BY 4.0),
# the news industry's standard hierarchical taxonomy. Descriptions are used for zero-shot
# classification by embedding similarity; deeper levels can be added later.
source: IPTC Media Topics (CC BY 4.0)
